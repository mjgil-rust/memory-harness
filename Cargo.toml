[package]
name = "memory-harness"
version = "0.1.0"
edition = "2021"
license = "0BSD"
description = "Linux process memory harness with rusage-based peak RSS reporting"
publish = false

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3.20"

[profile.release]
opt-level = 1
lto = false
codegen-units = 16
incremental = true
debug = 2
split-debuginfo = "off"
strip = "none"

[profile.release.package."*"]
opt-level = 3

[profile.ship]
inherits = "release"
opt-level = 3
lto = true
codegen-units = 1
incremental = false

[profile.coverage]
inherits = "dev"
opt-level = 0
debug = 1
incremental = false
